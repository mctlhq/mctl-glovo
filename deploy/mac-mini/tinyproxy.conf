# tinyproxy configuration for the Glovo egress proxy on the Mac mini.
#
# Template: replace every REPLACE_ME and <mini-tailscale-ip> before use.
# Install as ~/.config/tinyproxy/tinyproxy.conf (see README.md, "Glovo egress
# proxy (tinyproxy)"). Checked against tinyproxy.conf(5) of tinyproxy 1.11.3
# (docs/man5/tinyproxy.conf.txt.in at tag 1.11.3,
# https://github.com/tinyproxy/tinyproxy) and the directive table in
# src/conf.c at the same tag.
#
# Shape: mctl-glovo pod -> Tailscale -> this proxy -> CONNECT -> api.glovoapp.com.
# TLS stays end to end; the proxy sees only the CONNECT target host.

# tinyproxy.conf(5) Port: the port tinyproxy listens on.
Port 3128

# tinyproxy.conf(5) Listen: listen on this one address instead of the
# wildcard 0.0.0.0. Use the mini's Tailscale IPv4 address (tailscale ip -4).
# Never 0.0.0.0, never a LAN address.
Listen <mini-tailscale-ip>

# tinyproxy.conf(5) Timeout: seconds of inactivity before a connection is
# closed.
Timeout 60

# tinyproxy.conf(5) MaxClients: at most this many clients connected at once
# (one thread each).
MaxClients 20

# tinyproxy.conf(5) Allow/Deny: once any Allow or Deny line exists, every
# client not matched is denied. 100.64.0.0/10 is the Tailscale CGNAT range.
# This is a second fence only; the tailnet ACL (tag:glovo-egress ->
# tcp:3128) is what limits which nodes can connect.
Allow 100.64.0.0/10

# tinyproxy.conf(5) ConnectPort: ports allowed for CONNECT. With at least one
# line, every other port is refused. ConnectPort does not restrict plain HTTP
# (absolute-form) requests; the filter below still limits those to the
# Glovo host, and the cluster client refuses a non-https base URL
# (glovoapi.WithRequireProxy).
ConnectPort 443

# tinyproxy.conf(5) Filter: file of filter rules, one per line. FilterURLs No
# (the default) matches the rules against the request host only, which is
# the CONNECT target host for HTTPS (src/reqs.c: filter_run(request->host)).
# FilterDefaultDeny Yes turns the list into an allowlist: every host not
# matched is refused with 403 "Filtered".
# FilterType ere: POSIX extended regular expressions. In 1.11 FilterExtended
# is documented as "Deprecated. Use FilterType ere instead", so it is not
# used here. Matching is case-insensitive by default, which is right for
# host names.
Filter "/Users/REPLACE_ME/.config/tinyproxy/tinyproxy-filter"
FilterURLs No
FilterType ere
FilterDefaultDeny Yes

# tinyproxy.conf(5) DisableViaHeader: do not add a Via header (the default
# Via header carries this machine's host name). XTinyproxy is left out: it
# defaults to off, and when on it adds X-Tinyproxy with the client's IP.
DisableViaHeader Yes

# tinyproxy.conf(5) LogFile / LogLevel. Notice logs refused (filtered)
# requests and start-up, without per-connection noise. Mutually exclusive
# with Syslog.
LogFile "/Users/REPLACE_ME/Library/Logs/mctl-tinyproxy.log"
LogLevel Notice
