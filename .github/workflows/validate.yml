name: validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          args: --timeout 5m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go build & test
        run: |
          go build ./...
          go test -race -count=1 ./...

  remote-login:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-login
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remote-login/package-lock.json

      - name: npm ci & test
        # The helper runs Playwright's chrome-headless-shell, never Google
        # Chrome (the host kills that by name). Requiring the browser turns
        # a failed install into a failure instead of skipped tests.
        env:
          REMOTE_LOGIN_REQUIRE_BROWSER: "1"
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright-core install --with-deps chromium-headless-shell
          npm test
