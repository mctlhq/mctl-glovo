name: validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          args: --timeout 5m

  test:
    runs-on: ubuntu-latest
    # The token store's Postgres tests run against this service. The test
    # step sets TOKENSTORE_TEST_PG_REQUIRED, so a missing or unreachable
    # database fails the job instead of skipping those tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tokenstore
          POSTGRES_PASSWORD: tokenstore
          POSTGRES_DB: tokenstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenstore -d tokenstore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go build & test
        env:
          TOKENSTORE_TEST_PG_DSN: postgres://tokenstore:tokenstore@localhost:5432/tokenstore?sslmode=disable
          TOKENSTORE_TEST_PG_REQUIRED: "1"
        run: |
          go build ./...
          go test -race -count=1 ./...

  # The image must keep building. No push, no secrets, read-only token: a PR
  # cannot publish anything. Publishing is release-please.yml plus
  # mctl-gitops' build-image.yaml, from a release tag on main only.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: docker build (no push)
        run: docker build -t mctl-glovo:ci .

      - name: all entrypoints exist and the image runs non-root
        run: |
          docker run --rm --entrypoint sh mctl-glovo:ci -c 'test -x /usr/local/bin/mctl-glovo && test -x /usr/local/bin/glovo-migrate && test -x /usr/local/bin/token-refresher && test "$(id -u)" = 10001'
          # The migrator refuses an empty DSN with exit 1 and prints no secret.
          set +e
          docker run --rm --entrypoint glovo-migrate mctl-glovo:ci
          test $? -eq 1
          # The refresher refuses an empty configuration with exit 2 and
          # prints no secret.
          set +e
          docker run --rm --entrypoint token-refresher mctl-glovo:ci
          test $? -eq 2
