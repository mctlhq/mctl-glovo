name: validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          args: --timeout 5m

  test:
    runs-on: ubuntu-latest
    # The token store's Postgres tests run against this service. The test
    # step sets TOKENSTORE_TEST_PG_REQUIRED, so a missing or unreachable
    # database fails the job instead of skipping those tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tokenstore
          POSTGRES_PASSWORD: tokenstore
          POSTGRES_DB: tokenstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenstore -d tokenstore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go build & test
        env:
          TOKENSTORE_TEST_PG_DSN: postgres://tokenstore:tokenstore@localhost:5432/tokenstore?sslmode=disable
          TOKENSTORE_TEST_PG_REQUIRED: "1"
        run: |
          go build ./...
          go test -race -count=1 ./...
