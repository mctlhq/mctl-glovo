name: landing-worker

# Tests the edge copy of the landing page on every pull request that can
# change it, and deploys the Worker script after a merge to main. The route
# (glovo.mctl.ai/, root only) is owned by mctl-gitops, never by this job.

on:
  pull_request:
    paths:
      - 'landing-worker/**'
      - 'internal/gateway/landing*.go'
      - 'cmd/landing-gen/**'
      - '.github/workflows/landing-worker.yml'
  push:
    branches: [main]
    paths:
      - 'landing-worker/**'
      - 'internal/gateway/landing*.go'
      - 'cmd/landing-gen/**'
      - '.github/workflows/landing-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The Worker serves generated bytes; a stale file fails here, before
      # anything is deployed.
      - run: go test ./cmd/landing-gen/
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - working-directory: landing-worker
        run: node --test test/*.test.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Require deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::secret CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
      - name: Install wrangler
        run: npm install --global wrangler@4.87.0
      - name: Deploy worker
        working-directory: landing-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
