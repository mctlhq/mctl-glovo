# Cloudflare Worker serving the landing page at https://glovo.mctl.ai/.
#
# This file owns the script only. The route (glovo.mctl.ai/, the root path
# alone) is declared in mctl-gitops infrastructure/cloudflare/zones/mctl-ai/
